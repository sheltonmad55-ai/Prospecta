<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151329" />
      <stop offset="100%" stop-color="#090812" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  
  <!-- Subtle center glow -->
  <circle cx="32" cy="32" r="21" fill="url(#centerGlow)" />

  <!-- Radar Concentric Circles -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.35" />
  <circle cx="32" cy="32" r="16" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-opacity="0.65" />
  <circle cx="32" cy="32" r="9" fill="none" stroke="#a855f7" stroke-width="2.4" />

  <!-- Radar Crosshairs -->
  <line x1="32" y1="9" x2="32" y2="14" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="32" y1="50" x2="32" y2="55" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="9" y1="32" x2="14" y2="32" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="50" y1="32" x2="55" y2="32" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Radar Scanner Arm -->
  <line x1="32" y1="32" x2="48" y2="16" stroke="url(#radarGrad)" stroke-width="2.8" stroke-linecap="round" />

  <!-- Center Target Core -->
  <circle cx="32" cy="32" r="3.2" fill="#ffffff" />
  <circle cx="32" cy="32" r="1.5" fill="#a855f7" />

  <!-- Active Prospect Target / Blip -->
  <circle cx="43" cy="21" r="3" fill="#38bdf8" />
  <circle cx="43" cy="21" r="4.8" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
</svg>
